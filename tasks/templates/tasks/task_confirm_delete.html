{% extends 'base.html' %}
{% block title %}Delete Task{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card border-danger">
            <div class="card-body text-center p-5">
                <div class="mb-3" style="font-size:3rem; color:var(--bs-danger)"><i class="bi bi-exclamation-triangle-fill"></i></div>
                <h4 class="fw-bold">Delete Task?</h4>
                <p class="text-muted mb-4">
                    Are you sure you want to delete "<strong>{{ task.title }}</strong>"?
                    This will also delete all {{ task.get_comment_count }} comment(s).
                </p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger me-2"><i class="bi bi-trash me-1"></i>Delete</button>
                    <a href="{% url 'task_detail' task.pk %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
